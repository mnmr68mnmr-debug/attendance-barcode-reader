
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#14532d">
  <title>نظام الحضور بالباركود</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    :root {
      --green: #166534;
      --green-dark: #14532d;
      --border: #dbe3ea;
      --gray: #64748b;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px 14px 40px;
      background: #f5f7fa;
      color: #172033;
      font-family: Tahoma, Arial, sans-serif;
      line-height: 1.6;
    }

    main {
      max-width: 560px;
      margin: 0 auto;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 8px 28px rgba(15, 23, 42, .07);
    }

    h1 {
      margin: 0 0 6px;
      text-align: center;
      color: var(--green-dark);
      font-size: 1.55rem;
    }

    .subtitle {
      margin: 0 0 22px;
      text-align: center;
      color: var(--gray);
    }

    .section {
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      margin-top: 16px;
    }

    h2 {
      margin: 0 0 8px;
      font-size: 1.1rem;
    }

    .hint {
      color: var(--gray);
      font-size: .9rem;
      margin: 0 0 12px;
    }

    label {
      display: block;
      margin: 10px 0 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      min-height: 48px;
      border: 1px solid #b8c4d1;
      border-radius: 10px;
      padding: 10px 12px;
      font: inherit;
      direction: ltr;
      text-align: center;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    button {
      width: 100%;
      min-height: 48px;
      margin-top: 12px;
      border: 0;
      border-radius: 10px;
      padding: 10px 14px;
      font: inherit;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    .primary {
      background: var(--green);
      color: #fff;
    }

    .secondary {
      background: #e2e8f0;
      color: #172033;
    }

    #reader {
      width: 100%;
      overflow: hidden;
      border-radius: 10px;
    }

    #status {
      display: none;
      margin-top: 16px;
      border-radius: 10px;
      padding: 12px;
      text-align: center;
      font-weight: bold;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    #status.success {
      display: block;
      color: #166534;
      background: #dcfce7;
      border: 1px solid #86efac;
    }

    #status.error {
      display: block;
      color: #991b1b;
      background: #fee2e2;
      border: 1px solid #fca5a5;
    }

    #status.info {
      display: block;
      color: #1e40af;
      background: #dbeafe;
      border: 1px solid #93c5fd;
    }

    .footnote {
      color: var(--gray);
      font-size: .82rem;
      text-align: center;
      margin: 18px 0 0;
    }
  </style>
</head>

<body>
  <main>
    <h1>نظام الحضور بالباركود</h1>
    <p class="subtitle">
      اختر التسجيل بالكاميرا أو أدخل كود الشخص يدويًا
    </p>

    <section class="section">
      <h2>١. التسجيل بالكاميرا</h2>
      <p class="hint">
        اسمح للمتصفح باستخدام الكاميرا، ثم وجّهها إلى الباركود.
      </p>
      <div id="reader"></div>
      <button type="button" id="startCamera" class="primary">
        تشغيل الكاميرا
      </button>
      <button type="button" id="stopCamera" class="secondary" disabled>
        إيقاف الكاميرا
      </button>
    </section>

    <section class="section">
      <h2>٢. التسجيل اليدوي</h2>
      <p class="hint">
        أدخل الكود الموجود أسفل الباركود، مثل AT0001.
      </p>

      <form id="manualForm">
        <label for="personCode">كود الشخص</label>
        <input
          id="personCode"
          name="personCode"
          type="text"
          placeholder="AT0001"
          maxlength="6"
          pattern="AT[0-9]{4}"
          autocomplete="off"
          autocapitalize="characters"
          required
        >
        <button type="submit" id="manualSubmit" class="primary">
          تسجيل الحضور
        </button>
      </form>
    </section>

    <div id="status" role="status" aria-live="polite"></div>

    <p class="footnote">
      يتم التحقق من الكود وتسجيل الحضور من خلال نظام Google Sheets المرتبط.
    </p>
  </main>

  <script>
    // رابط Google Apps Script الحالي
    const APP_URL =
      "https://script.google.com/macros/s/AKfycbyU9HkbRdXMGz866YpwdmvI8mTHHckchNn9bNvUSRuLEJH4t9JgVkGAp1a1Rv28tTUr/exec";

    const statusBox = document.getElementById("status");
    const manualForm = document.getElementById("manualForm");
    const personCodeInput = document.getElementById("personCode");
    const startCameraButton = document.getElementById("startCamera");
    const stopCameraButton = document.getElementById("stopCamera");

    let scanner = null;
    let cameraRunning = false;
    let submissionInProgress = false;

    function showStatus(message, type) {
      statusBox.textContent = message;
      statusBox.className = type || "info";
      statusBox.style.display = "block";
    }

    function normalizeCode(value) {
      return String(value || "")
        .trim()
        .toUpperCase()
        .replace(/\s+/g, "");
    }

    function validCode(code) {
      return /^AT\d{4}$/.test(code);
    }

    function submitAttendance(rawCode) {
      const code = normalizeCode(rawCode);

      if (!validCode(code)) {
        showStatus(
          "الكود غير صحيح. أدخل كودًا مثل AT0001.",
          "error"
        );
        return;
      }

      if (submissionInProgress) return;
      submissionInProgress = true;

      const resultUrl =
        APP_URL + "?code=" + encodeURIComponent(code);

      showStatus(
        "جارٍ فتح صفحة نتيجة التسجيل للكود " + code + "...",
        "info"
      );

      const resultTab = window.open(resultUrl, "_blank");

      if (resultTab) {
        showStatus(
          "تم فتح صفحة نتيجة التسجيل في علامة تبويب جديدة.\n" +
          "الكود: " + code + "\n" +
          "ارجع إلى هذه الصفحة لمتابعة التسجيل.",
          "success"
        );
      } else {
        showStatus(
          "المتصفح منع فتح صفحة النتيجة. اسمح بالنوافذ المنبثقة، " +
          "أو افتح الرابط التالي يدويًا:\n" + resultUrl,
          "error"
        );
      }

      window.setTimeout(function () {
        submissionInProgress = false;
      }, 1800);
    }

    // التسجيل اليدوي
    manualForm.addEventListener("submit", function (event) {
      event.preventDefault();
      submitAttendance(personCodeInput.value);
    });

    // تشغيل الكاميرا عند الضغط على الزر فقط
    async function startCamera() {
      if (cameraRunning) return;

      if (!window.Html5Qrcode) {
        showStatus(
          "تعذر تحميل قارئ الباركود. تحقق من اتصال الإنترنت وأعد تحميل الصفحة.",
          "error"
        );
        return;
      }

      startCameraButton.disabled = true;
      showStatus("جارٍ تشغيل الكاميرا...", "info");

      try {
        scanner = new Html5Qrcode("reader");
        const cameras = await Html5Qrcode.getCameras();

        if (!cameras || cameras.length === 0) {
          throw new Error("لم يتم العثور على كاميرا متاحة.");
        }

        const preferredCamera =
          cameras.find(camera =>
            /back|rear|environment|خلف/i.test(camera.label)
          ) || cameras[cameras.length - 1];

        await scanner.start(
          preferredCamera.id,
          {
            fps: 10,
            qrbox: function (viewWidth, viewHeight) {
              const side = Math.max(
                180,
                Math.min(
                  300,
                  Math.floor(Math.min(viewWidth, viewHeight) * 0.75)
                )
              );
              return {
                width: side,
                height: Math.floor(side * 0.65)
              };
            },
            aspectRatio: 1.4,
            formatsToSupport: [
              Html5QrcodeSupportedFormats.CODE_128,
              Html5QrcodeSupportedFormats.CODE_39,
              Html5QrcodeSupportedFormats.QR_CODE
            ]
          },
          function (decodedText) {
            const code = normalizeCode(decodedText);

            if (validCode(code)) {
              stopCamera().then(function () {
                submitAttendance(code);
              });
            } else {
              showStatus(
                "الرمز المقروء ليس كود حضور صالحًا: " + decodedText,
                "error"
              );
            }
          },
          function () {
            // تجاهل أخطاء عدم القراءة أثناء تحريك الكاميرا
          }
        );

        cameraRunning = true;
        stopCameraButton.disabled = false;
        showStatus("الكاميرا تعمل. وجّهها إلى الباركود.", "info");

      } catch (error) {
        cameraRunning = false;
        startCameraButton.disabled = false;
        stopCameraButton.disabled = true;

        showStatus(
          "تعذر تشغيل الكاميرا: " +
          (error && error.message ? error.message : error) +
          "\nتحقق من إذن الكاميرا وافتح الصفحة من رابط GitHub Pages الآمن.",
          "error"
        );

        if (scanner) {
          try {
            await scanner.clear();
          } catch (ignored) {}
          scanner = null;
        }
      }
    }

    async function stopCamera() {
      if (scanner && cameraRunning) {
        try {
          await scanner.stop();
        } catch (error) {}
      }

      if (scanner) {
        try {
          await scanner.clear();
        } catch (error) {}
      }

      scanner = null;
      cameraRunning = false;
      startCameraButton.disabled = false;
      stopCameraButton.disabled = true;
    }

    startCameraButton.addEventListener("click", startCamera);
    stopCameraButton.addEventListener("click", stopCamera);

    // تجهيز الكود إذا فُتحت الصفحة مع معامل code
    const queryCode =
      new URLSearchParams(window.location.search).get("code");

    if (queryCode) {
      personCodeInput.value = normalizeCode(queryCode);
      showStatus(
        "تم تجهيز الكود " + normalizeCode(queryCode) +
        " في خانة التسجيل اليدوي.",
        "info"
      );
    }
  </script>
</body>
</html>
